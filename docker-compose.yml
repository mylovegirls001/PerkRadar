# Compose project is fixed so this stack does not follow the directory name
# and does not attach to another project's network, volume, or containers.
name: daily-free-info

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: daily-free-info:local
    container_name: daily-free-info
    restart: unless-stopped
    ports:
      # Host loopback only. Override the host port with HOST_PORT if 38471 is taken.
      # The process inside the container always listens on 38471.
      - "127.0.0.1:${HOST_PORT:-38471}:38471"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "38471"
      DATA_DIR: /data
      JINA_API_KEY: ${JINA_API_KEY:-}
      JINA_API_KEY_FILE: ${JINA_API_KEY_FILE:-}
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:38471/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
