# .github/workflows/build.yml
#
# 手动触发的完整构建流水线：lint → test → build → Docker 镜像推送至 GHCR
# 在 Actions 页面点 "Run workflow" 即可触发

name: Build

on:
  workflow_dispatch:
    # 可选：手动触发时输入镜像 tag，不填则用 latest
    inputs:
      image_tag:
        description: '镜像 tag（留空则用 latest）'
        required: false
        default: 'latest'

concurrency:
  group: build-manual
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ── Job 1: lint + test + build ──
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit (production only)
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

  # ── Job 2: 构建并推送 Docker 镜像 ──
  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
